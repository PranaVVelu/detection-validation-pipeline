title: Command Shell Obfuscated With Environment Variable Substring
id: e41c7d90-3f6a-4b28-8a15-96d2b7c0f3a4
status: experimental
description: >
  Detects the %VAR:~start,length% substring syntax on a cmd.exe command line,
  used to assemble commands such as "cmd" without writing them literally.
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: PranaVVelu
date: 2026-11-03
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    CommandLine|re: '%[A-Za-z_]+:~-?\d+,\d+%'
  condition: selection
falsepositives:
  - Legacy batch scripts that use substring expansion
level: medium
# Atomic Red Team test (auto_generated_guid) that CI runs to validate this rule.
x_atomic_test: d0eb3597-a1b3-4d65-b33b-2cda8d397f20
