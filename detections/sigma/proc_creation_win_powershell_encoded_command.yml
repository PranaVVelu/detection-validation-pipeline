title: PowerShell Launched With Encoded Command
id: 5b2f8c1e-7a44-4e0b-9d3a-2c61f0a8e7d1
status: experimental
description: >
  Detects PowerShell started with -EncodedCommand or one of its abbreviations,
  often used to hide the executed script from casual inspection.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: PranaVVelu
date: 2026-11-03
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    # Requiring the trailing space stops " -e" from matching -ExecutionPolicy.
    CommandLine|contains:
      - ' -e '
      - ' -ec '
      - ' -en '
      - ' -enc '
      - ' -enco '
      - ' -encod '
      - ' -encode '
      - ' -encoded '
      - ' -encodedcommand '
  condition: all of selection_*
falsepositives:
  - Management tooling that wraps scripts in encoded commands
level: medium
# Atomic Red Team test (auto_generated_guid) that CI runs to validate this rule.
x_atomic_test: a538de64-1c74-46ed-aa60-b995ed302598
