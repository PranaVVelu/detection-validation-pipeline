name: Detection Validation

on:
  # No path filter on PRs: the "gate" job must always report, so that it can be a
  # required status check. PRs with no rule changes select zero rules and finish fast.
  pull_request:
  push:
    branches: [main]
    paths:
      - "detections/**"
      - "simulation/**"
      - "src/**"
      - "scripts/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements*.txt"
      - ".github/workflows/detect-test.yml"
  workflow_dispatch: # Manual run: re-validates every rule.

# PR code is untrusted, so the token is read-only.
permissions:
  contents: read

concurrency:
  group: detect-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-test:
    name: Pipeline self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests and negative controls
        run: python -m pytest
      - name: Lint Sigma rules
        run: sigma check detections/sigma

  discover:
    name: Discover changed rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history, so the base commit can be diffed.
      - id: select
        name: Select rules to validate
        env:
          # Event data reaches the shell through env, never by inline expansion,
          # which prevents script injection.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          VALIDATE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$VALIDATE_ALL" = "true" ]; then
            python3 scripts/discover_rules.py --all
          else
            python3 scripts/discover_rules.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  validate:
    name: Validate ${{ matrix.rule }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false # Report on every rule, not only the first failure.
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      RULE: ${{ matrix.rule }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      SIEM_URL: http://siem:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the isolated test range
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p reports
          HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up -d --build --wait siem

      - name: Simulate the Atomic Red Team test
        run: >
          docker compose run --rm simulator python scripts/simulate_atomic.py
          --rule "$RULE" --run-id "$RUN_ID" --out reports/events.jsonl

      - name: Load the rule and ship telemetry to the SIEM
        run: >
          docker compose run --rm runner python scripts/ship_events.py
          --rule "$RULE" --events reports/events.jsonl --run-id "$RUN_ID" --siem-url "$SIEM_URL"

      - name: Validate the alert
        # Exit codes: 0 = pass, 1 = rule failed, 2 = no trustworthy verdict.
        run: >
          docker compose run --rm runner python scripts/validate_alert.py
          --rule "$RULE" --run-id "$RUN_ID" --siem-url "$SIEM_URL"
          --report reports/report.json --summary reports/summary.md

      - name: Publish the job summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ ERROR: the pipeline stopped before validation. See the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show SIEM logs on failure
        if: failure()
        run: docker compose logs siem

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.name }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Matrix job names change with the rules, so branch protection needs one stable
  # check. Without this job, a skipped or failed matrix could go unnoticed.
  gate:
    name: Detection gate
    if: always()
    needs: [self-test, discover, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every stage to succeed
        env:
          SELF_TEST: ${{ needs.self-test.result }}
          DISCOVER: ${{ needs.discover.result }}
          VALIDATE: ${{ needs.validate.result }}
          RULE_COUNT: ${{ needs.discover.outputs.count }}
        run: |
          echo "self-test=$SELF_TEST discover=$DISCOVER validate=$VALIDATE rules=$RULE_COUNT"
          [ "$SELF_TEST" = "success" ] && [ "$DISCOVER" = "success" ] || exit 1
          # Skipping validation is only acceptable when no rule needed it.
          if [ "$RULE_COUNT" = "0" ]; then
            [ "$VALIDATE" = "skipped" ]
          else
            [ "$VALIDATE" = "success" ]
          fi
